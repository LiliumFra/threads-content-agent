name: Refresh Threads metrics

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Refresh post insights
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node dist/src/cli/worker.js metrics
      - name: Persist metric updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/results
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Threads metrics [skip ci]"
            git push
          fi
