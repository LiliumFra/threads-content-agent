name: Bootstrap Node 24 lockfile

on:
  push:
    branches: [node24-lock-bootstrap]
    paths:
      - "package.json"
      - ".github/workflows/node24-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist Node 24 lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate lockfile for Node 24 [skip ci]"
            git push origin HEAD:node24-lock-bootstrap
          fi
