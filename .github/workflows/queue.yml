name: Process Threads queue

on:
  push:
    branches: [main]
    paths:
      - "jobs/pending/**/*.json"
      - "jobs/pending/*.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-state-writer
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Process due jobs serially
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ vars.CLOUDINARY_FOLDER }}
        run: node dist/src/cli/worker.js queue
      - name: Persist queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/pending jobs/results
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist Threads queue results [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Failed to persist queue state after retries" >&2
            exit 1
          fi
