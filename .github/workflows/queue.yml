name: Process Threads queue

on:
  push:
    branches: [main]
    paths:
      - "jobs/pending/**/*.json"
      - "jobs/pending/*.json"
  schedule:
    # Push handles newly-created jobs immediately; this sparse fallback wakes future-dated jobs.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-state-writer
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check whether there is work
        id: work
        shell: bash
        run: |
          if find jobs/pending -maxdepth 1 -type f -name '*.json' -print -quit | grep -q .; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.work.outputs.has_jobs == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - if: steps.work.outputs.has_jobs == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.work.outputs.has_jobs == 'true'
        run: npm run build
      - name: Process due jobs serially
        if: steps.work.outputs.has_jobs == 'true'
        env:
          PUBLISH_PROVIDER: buffer
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ vars.CLOUDINARY_FOLDER }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node dist/src/cli/worker.js queue
      - name: Persist queue state
        if: steps.work.outputs.has_jobs == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/pending jobs/results
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist Threads queue results [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Failed to persist queue state after retries" >&2
            exit 1
          fi
